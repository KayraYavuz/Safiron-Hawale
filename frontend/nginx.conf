server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.safironpay.com https://hawale-backend-174683789974.europe-west3.run.app;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA routing — tüm bilinmeyen URL'leri index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik asset'ler — uzun cache (hash'li dosyalar)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sağlık kontrolü
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Hata sayfalarını da SPA'ya yönlendir
    error_page 404 /index.html;
}
