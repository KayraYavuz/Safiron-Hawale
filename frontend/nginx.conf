server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — tüm bilinmeyen URL'leri index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik asset'ler — uzun cache (hash'li dosyalar)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sağlık kontrolü
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Hata sayfalarını da SPA'ya yönlendir
    error_page 404 /index.html;
}
